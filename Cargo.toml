[package]
name = "polyarb"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"          # WebSocket client
reqwest = { version = "0.11", features = ["json"] }  # HTTP client
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
config = "0.13"                     # config file loading
tracing = "0.1"                     # structured logging
tracing-subscriber = "0.3"
anyhow = "1"                        # error handling
ethers = { version = "2", features = ["rustls"] }  # wallet signing
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"                       # concurrent hashmap for state
crossbeam-channel = "0.5"          # fast inter-thread messaging
futures-util = "0.3"               # stream extensions for WebSocket
